name: IndexNow – heikkilund.fi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow.yml'

permissions: {}

concurrency:
  group: indexnow-heikkilund-fi
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify key and submit page URLs from the published sitemap
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import re
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          
          HOST = 'heikkilund.fi'
          KEY = 'fc8dad8feb2440cc95850ecf0c003a92'
          KEY_URL = f'https://{HOST}/{KEY}.txt'
          SITEMAP = f'https://{HOST}/sitemap.xml'
          ENDPOINT = 'https://api.indexnow.org/indexnow'
          MAX_BYTES = 10 * 1024 * 1024
          
          
          def check_url(url):
              p = urlsplit(url)
              if p.scheme != 'https' or p.netloc != HOST or p.username or p.password or p.fragment:
                  raise ValueError(f'Unexpected sitemap URL: {url}')
              return url
          
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  check_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          
          
          opener = urllib.request.build_opener(SafeRedirect())
          
          
          def read_site(url):
              check_url(url)
              with opener.open(urllib.request.Request(url, headers={'User-Agent': 'HeikkiLund-IndexNow/1.0'}), timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'Website returned HTTP {response.status}')
                  data = response.read(MAX_BYTES + 1)
                  if len(data) > MAX_BYTES:
                      raise ValueError('Website response exceeds 10 MiB')
                  return data
          
          
          def sitemap_urls(url, visited=None):
              visited = set() if visited is None else visited
              if url in visited:
                  return []
              if len(visited) >= 100:
                  raise ValueError('Too many sitemap files')
              visited.add(url)
              root = ET.fromstring(read_site(url))
              kind = root.tag.rsplit('}', 1)[-1]
              if kind not in ('urlset', 'sitemapindex'):
                  raise ValueError('Expected an XML urlset or sitemapindex')
              urls = []
              entry_kind = 'url' if kind == 'urlset' else 'sitemap'
              for entry in root:
                  if entry.tag.rsplit('}', 1)[-1] != entry_kind:
                      continue
                  locations = [child for child in entry if child.tag.rsplit('}', 1)[-1] == 'loc']
                  if len(locations) != 1 or not locations[0].text:
                      raise ValueError('Sitemap entry is missing a unique loc')
                  location = check_url(locations[0].text.strip())
                  urls.extend([location] if kind == 'urlset' else sitemap_urls(location, visited))
              return urls
          
          
          def main():
              if not re.fullmatch(r'[a-zA-Z0-9-]{8,128}', KEY):
                  raise ValueError('Invalid IndexNow key')
              if read_site(KEY_URL).decode('utf-8-sig').strip() != KEY:
                  raise ValueError('Published IndexNow key file does not match the configured key')
              urls = sorted(set(sitemap_urls(SITEMAP)))
              if not urls:
                  raise ValueError('Sitemap contains no page URLs')
              print(f'Key verified; {len(urls)} unique page URLs found.')
              for start in range(0, len(urls), 10000):
                  batch = urls[start:start + 10000]
                  payload = json.dumps({'host': HOST, 'key': KEY, 'keyLocation': KEY_URL, 'urlList': batch}).encode('utf-8')
                  request = urllib.request.Request(ENDPOINT, data=payload, headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      raise RuntimeError(f'IndexNow rejected submission: HTTP {error.code}') from error
                  if status not in (200, 202):
                      raise RuntimeError(f'Unexpected IndexNow HTTP status: {status}')
                  print(f'Submitted {len(batch)} URLs: HTTP {status}' + (' (key validation pending)' if status == 202 else ''))
              print('Submission received. Search engine indexing is not guaranteed.')
          
          
          if __name__ == '__main__':
              main()
          PYTHON
